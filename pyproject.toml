# kisan-agent/pyproject.toml
# ──────────────────────────────────────────────────────────────────────────────
# Kisan-Agent: Autonomous PMFBY Farmer Subsidy Execution Engine
# Python ≥ 3.11  (async features + TypedDict generics require 3.11+)
# ──────────────────────────────────────────────────────────────────────────────

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "kisan-agent"
version     = "1.0.0"
description = "Autonomous PMFBY crop insurance filing engine via WhatsApp"
readme      = "README.md"
requires-python = ">=3.11"
license     = { text = "MIT" }

authors = [
  { name = "Kisan-Agent Team" },
]

keywords = [
  "langgraph", "playwright", "whatsapp", "pmfby", "geopandas",
  "gemini", "bhashini", "agentic-ai", "civic-tech"
]

# ── Core runtime dependencies ────────────────────────────────────────────────
dependencies = [
  # Web framework & async HTTP
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "httpx>=0.27.0",

  # LangGraph agentic orchestration
  "langgraph>=0.1.14",
  "langchain-core>=0.2.0",

  # Gemini SDK
  "google-generativeai>=0.7.0",

  # Redis (async)
  "redis[asyncio]>=5.0.4",

  # Pydantic v2 & settings
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",

  # Geospatial
  "geopandas>=0.14.4",
  "shapely>=2.0.4",

  # Browser automation
  "playwright>=1.44.0",

  # Computer vision & image processing
  "opencv-python-headless>=4.9.0.80",
  "Pillow>=10.3.0",
  "numpy>=1.26.4",

  # Misc utilities
  "python-dotenv>=1.0.1",
  "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.4.4",
  "mypy>=1.10.0",
  "pre-commit>=3.7.1",
]

[project.scripts]
kisan-agent = "app.main:main"

# ── Tool configuration ────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode    = "auto"
testpaths       = ["tests"]
addopts         = "-v --tb=short"
log_cli         = true
log_cli_level   = "INFO"

[tool.ruff]
target-version = "py311"
line-length    = 100
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "S",   # flake8-bandit (security)
  "ANN", # flake8-annotations
]
ignore = [
  "S101",   # assert — used in tests
  "ANN101", # Missing type for `self`
]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN", "S"]  # Relax annotation/security rules in tests

[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true
plugins                = ["pydantic.mypy"]

[tool.coverage.run]
source   = ["app"]
omit     = ["tests/*", "app/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

